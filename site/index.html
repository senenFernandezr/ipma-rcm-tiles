<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Riesgo de incendio (RCM) - IPMA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel {
    background: rgba(255,255,255,.93); padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); max-width: 230px;
  }
  .panel h1 { font-size: 14px; margin: 0 0 4px; }
  .panel .meta { font-size: 12px; color: #444; margin: 0 0 6px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 12px; }
  .swatch { width: 16px; height: 12px; border: 1px solid rgba(0,0,0,.35); border-radius: 2px; }
  .note { font-size: 11px; color: #666; margin-top: 6px; }
  details { margin-top: 6px; }
  summary { font-size: 12px; font-weight: 600; cursor: pointer; }
  .url-row { margin: 6px 0; }
  .url-row code {
    display: block; font-size: 10px; word-break: break-all; color: #222;
    background: #f1f1f1; border-radius: 4px; padding: 3px 4px;
  }
  .files a { display: block; font-size: 12px; margin: 4px 0; color: #0645ad; }
  .files .size { color: #777; font-size: 11px; }
  .url-row button {
    margin-top: 3px; font-size: 11px; padding: 4px 8px; border-radius: 4px;
    border: 1px solid #bbb; background: #fff; cursor: pointer;
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin="anonymous"></script>
<script>
  // Zooms realmente generados; meta.json los confirma al cargar.
  var ZMIN = 6, ZMAX = 12;
  // Por encima de ZMAX no hay teselas propias: maxNativeZoom hace que Leaflet
  // reescale la de ZMAX en vez de pedir una que no existe y dejar el hueco vacio.
  var ZVIEW = 19;

  var map = L.map('map', { zoomControl: true, maxZoom: ZVIEW }).setView([39.6, -8.0], 7);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: ZVIEW, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  function rcmLayer(path) {
    return L.tileLayer(path + '/{z}/{x}/{y}.png', {
      minZoom: ZMIN, maxNativeZoom: ZMAX, maxZoom: ZVIEW,
      opacity: 1, attribution: 'RCM &copy; IPMA'
    });
  }

  var today = rcmLayer('today').addTo(map);
  var tomorrow = rcmLayer('tomorrow');
  L.control.layers({}, { 'Hoy (today)': today, 'Mañana (tomorrow)': tomorrow },
                   { collapsed: false }).addTo(map);

  var info = L.control({ position: 'bottomleft' });
  info.onAdd = function () {
    var d = L.DomUtil.create('div', 'panel');
    d.innerHTML = '<h1>Riesgo de incendio (RCM)</h1><p class="meta" id="meta">cargando...</p>'
      + '<div id="legend"></div>'
      + '<details><summary>URL para la app</summary>'
      + '<div class="url-row"><code id="u-today"></code>'
      + '<button type="button" data-layer="today">Copiar (hoy)</button></div>'
      + '<div class="url-row"><code id="u-tomorrow"></code>'
      + '<button type="button" data-layer="tomorrow">Copiar (mañana)</button></div>'
      + '<p class="note">Zoom 6 a 12; por encima, la app reescala.<br>'
      + '<b>OsmAnd</b>: Configure map &rarr; Overlay map.<br>'
      + '<b>DMD2</b> (necesita licencia): Map Settings &rarr; Online Map Layers '
      + '&rarr; Add Custom Raster.</p></details>'
      + '<details open><summary>Instalar en OsmAnd (1 toque)</summary>'
      + '<div id="osmand" class="files">cargando...</div>'
      + '<p class="note">Abre el enlace en el móvil y elige <b>OsmAnd</b>. '
      + 'Crea la fuente ya configurada. Luego: Configure map &rarr; Overlay map '
      + '&rarr; elígela.<br>Y pon la caducidad, o no se actualizará: Maps &amp; '
      + 'Resources &rarr; Local &rarr; Map sources &rarr; la fuente &rarr; '
      + '&#8942; &rarr; Edit &rarr; <b>Expire time = 120</b>.</p></details>'
      + '<details><summary>KMZ con polígonos (otras apps)</summary>'
      + '<div id="files-kmz" class="files">cargando...</div>'
      + '<p class="note">Polígonos con color propio. No sirven en DMD2, que los '
      + 'importa como rutas.</p></details>'
      + '<p class="note">Previsión de riesgo meteorológico de incendio. No muestra incendios activos.</p>';
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  info.addTo(map);

  // URL absoluta de cada capa, para copiar y pegar en la app.
  // Sin new URL(): codificaria las llaves de {z}/{x}/{y} como %7B.
  var base = location.origin + location.pathname.replace(/[^/]*$/, '');
  var urls = { today: base + 'today/{z}/{x}/{y}.png',
               tomorrow: base + 'tomorrow/{z}/{x}/{y}.png' };
  document.getElementById('u-today').textContent = urls.today;
  document.getElementById('u-tomorrow').textContent = urls.tomorrow;

  // "Magic URL" de OsmAnd: crea la fuente de teselas ya configurada.
  // El url_template va sin codificar, como en el ejemplo de su documentacion.
  function osmandLink(layer, label) {
    return 'https://osmand.net/add-tile-source'
      + '?name=' + encodeURIComponent(label)
      + '&min_zoom=' + ZMIN + '&max_zoom=' + ZMAX
      + '&url_template=' + urls[layer];
  }
  // Se vuelve a pintar tras leer meta.json, por si cambian los zooms.
  function renderOsmandLinks() {
    document.getElementById('osmand').innerHTML =
      '<a href="' + osmandLink('today', 'RCM hoy (IPMA)') + '">'
      + 'Instalar capa <b>Hoy</b> en OsmAnd</a>'
      + '<a href="' + osmandLink('tomorrow', 'RCM manana (IPMA)') + '">'
      + 'Instalar capa <b>Mañana</b> en OsmAnd</a>';
  }
  renderOsmandLinks();

  document.querySelectorAll('.url-row button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var text = urls[btn.getAttribute('data-layer')];
      var done = function () { btn.textContent = '¡Copiado!'; };
      var fail = function () {
        // Sin acceso al portapapeles: se selecciona para copiar a mano.
        var range = document.createRange();
        range.selectNodeContents(btn.parentNode.querySelector('code'));
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = 'Copia a mano';
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fail);
      } else {
        fail();
      }
    });
  });

  fetch('meta.json?_=' + Date.now()).then(function (r) { return r.json(); }).then(function (m) {
    var t = (m.layers && m.layers.today) || {};
    var el = document.getElementById('meta');
    el.textContent = 'Hoy: ' + (t.dataPrev || '?') + ' | IPMA ' + (t.fileDate || '?') +
      ' | generado ' + (m.generatedAt || '?');
    if (t.stale) {
      el.innerHTML += '<br><b style="color:#b00">Atención: datos del ' + t.dataPrev +
        ', el IPMA aún no ha publicado ' + t.expectedDate + '.</b>';
    }
    var html = (m.legend || []).map(function (l) {
      return '<div class="legend-row"><span class="swatch" style="background:' + l.color +
             '"></span>' + l.rcm + ' - ' + l.label + '</div>';
    }).join('');
    document.getElementById('legend').innerHTML = html;

    // Ficheros para apps que no aceptan capas raster propias.
    var files = m.files || {};
    var day = function (k) { return k.indexOf('-today') > -1 ? 'Hoy' : 'Mañana'; };
    var kmz = [];
    Object.keys(files).sort().forEach(function (k) {
      var f = files[k];
      if (!f.kmz) { return; }
      kmz.push({ sort: (day(k) === 'Hoy' ? 0 : 1) * 10 + (f.minRcm > 1 ? 0 : 1),
        html: '<a href="' + f.kmz + '" download>' + day(k) +
              (f.minRcm > 1 ? ' &middot; solo nivel 4-5' : ' &middot; todos los niveles') +
              ' <span class="size">' + Math.round(f.kmzBytes / 1024) + ' KB</span></a>' });
    });
    kmz.sort(function (a, b) { return a.sort - b.sort; });
    document.getElementById('files-kmz').innerHTML = kmz.length
      ? kmz.map(function (x) { return x.html; }).join('')
      : 'sin ficheros';

    // Ajustar los limites reales de las capas a lo que diga meta.json.
    if (m.zoomMax) {
      ZMIN = m.zoomMin;
      ZMAX = m.zoomMax;
      [today, tomorrow].forEach(function (layer) {
        layer.options.minZoom = ZMIN;
        layer.options.maxNativeZoom = ZMAX;
        if (m.bbox) {
          layer.options.bounds = L.latLngBounds(
            [m.bbox[1], m.bbox[0]], [m.bbox[3], m.bbox[2]]);
        }
        if (map.hasLayer(layer)) { layer.redraw(); }
      });
      renderOsmandLinks();
    }
  }).catch(function () {
    document.getElementById('meta').textContent = 'meta.json no disponible';
  });
</script>
</body>
</html>
